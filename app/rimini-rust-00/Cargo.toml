[package]
authors = ["ppbrs"]
name = "rimini-rust-00"
edition = "2024"
version = "0.1.0"

[[bin]]
name = "main"
path = "src/bin/main.rs"
test = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
semihosting = "0.1.20"
panic-halt = "1.0"

[dev-dependencies]

# cargo build/run
[profile.dev]
# default is opt-level = '0', but that makes very verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1

# cargo build/run --release
[profile.release]
# default is opt-level = '3', but that makes quite verbose machine code
opt-level = 's'
# trade compile speed for slightly better optimisations
codegen-units = 1
# Use Link Time Optimisations to further inline things across crates
lto = 'fat'
# Leave the debug symbols in (default is no debug info)
debug = 2
